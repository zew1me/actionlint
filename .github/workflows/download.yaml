name: Download script
on:
  push:
    paths:
      - scripts/download-actionlint.bash
      - scripts/test-download-actionlint.bash
  pull_request:
    paths:
      - scripts/download-actionlint.bash
      - scripts/test-download-actionlint.bash
  workflow_dispatch:

jobs:
  download:
    name: Test download script
    # The script downloads release archives of this fork, which do not exist until the fork publishes its first release.
    # Set the repository variable FORK_HAS_RELEASES=true after that to enable this job.
    if: ${{ vars.FORK_HAS_RELEASES == 'true' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/test-download-actionlint.bash
        shell: bash

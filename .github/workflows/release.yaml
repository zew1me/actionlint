name: Release
on:
  push:
    tags:
      - "v*.*.*"

env:
  # Package/distribution identity of this fork. Default name; change it here (and in .goreleaser.yaml `project_name` and
  # scripts/download-actionlint.bash `package_name`). The command name stays `actionlint`.
  PACKAGE_NAME: actionlint-zew1me

# Publishing safety: every job only runs in zew1me/actionlint and only publishes to destinations owned by it (GitHub
# releases/Casks of this repository, ghcr.io/zew1me). Nothing here uses upstream's (rhysd) Docker Hub, winget or tap.
jobs:
  binaries:
    if: ${{ github.repository == 'zew1me/actionlint' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install ronn
      - run: ronn ./man/actionlint.1.ronn
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
      - name: Get version
        run: echo VERSION="${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ format('./dist/{0}_{1}_checksums.txt', env.PACKAGE_NAME, env.VERSION) }}
      - name: Post-release download check
        run: bash ./scripts/download-actionlint.bash "$VERSION"
      - name: Clone nested repository to make version bump commit
        uses: actions/checkout@v6
        with:
          path: ./tmp-actionlint-for-update-ver
          ref: main
          fetch-depth: 0
      - name: Update version in download script
        run: |
          set -x
          cd ./tmp-actionlint-for-update-ver
          sed -i -E "s/version=\"[0-9]+\\.[0-9]+\\.[0-9]+\"/version=\"${VERSION}\"/" ./scripts/download-actionlint.bash
          git diff
          git add ./scripts/download-actionlint.bash
          git -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c user.name='github-actions[bot]' commit -m "update version to $VERSION in download-actionlint.bash"
          git log -n 1
          git push
  # The `winget` job of upstream was REMOVED in this fork. Its identifier `rhysd.actionlint` belongs to upstream's package in
  # microsoft/winget-pkgs, so running winget-releaser here would open a PR against upstream's package. To publish the fork to
  # winget, register a new fork-specific identifier (e.g. zew1me.actionlint-zew1me), create a WINGET_TOKEN secret, and add a
  # job gated with `if: github.repository == 'zew1me/actionlint'` that uses that identifier.
  docker:
    if: ${{ github.repository == 'zew1me/actionlint' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Get tag name
        id: tag
        run: |
          echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          build-args: |
            GOLANG_VER=1.26
            ACTIONLINT_VER=${{ steps.tag.outputs.name }}
          push: true
          tags: |
            ghcr.io/zew1me/${{ env.PACKAGE_NAME }}:${{ steps.tag.outputs.name }}
            ghcr.io/zew1me/${{ env.PACKAGE_NAME }}:latest

version: 2

# Package/distribution identity of this fork. This is the single place to change the default name `actionlint-zew1me`.
# It drives the release archive names (`{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}`), the checksum file and the
# Homebrew cask name. The command name stays `actionlint` (see `binary:` below) so that it is a drop-in replacement.
# The same name is used in .github/workflows/release.yaml (PACKAGE_NAME) and scripts/download-actionlint.bash (package_name).
project_name: actionlint-zew1me

release:
  draft: false
  prerelease: true
  # Never publish releases anywhere but this fork
  github:
    owner: zew1me
    name: actionlint

before:
  hooks:
    - go mod download

builds:
  - <<: &build_defaults
      main: ./cmd/actionlint
      binary: actionlint
      ldflags: -s -w -X github.com/zew1me/actionlint.version={{.Version}} -X "github.com/zew1me/actionlint.installedFrom=installed by downloading from release page"
      env:
        - CGO_ENABLED=0
    id: macos
    goos: [darwin]
    goarch: [amd64, arm64]

  - <<: *build_defaults
    id: linux
    goos: [linux]
    goarch: [386, arm, amd64, arm64]

  - <<: *build_defaults
    id: windows
    goos: [windows]
    goarch: [386, amd64, arm64]

  - <<: *build_defaults
    id: freebsd
    goos: [freebsd]
    goarch: [386, amd64]

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

archives:
  - <<: &archives_defaults
      files:
        - README.md
        - LICENSE.txt
        - docs
        - man/actionlint.1
    id: nix
    ids: [macos, linux, freebsd]
    formats: [tar.gz]
  - <<: *archives_defaults
    id: windows
    ids: [windows]
    formats: [zip]

homebrew_casks:
  - name: "{{ .ProjectName }}"
    directory: Casks
    binaries: [actionlint]
    manpages: [man/actionlint.1]
    homepage: https://github.com/zew1me/actionlint#readme
    # The executable is still named `actionlint`, so it conflicts with upstream's cask
    conflicts:
      - cask: actionlint
    description: Static checker for GitHub Actions workflow files
    dependencies:
      - formula: shellcheck
    repository:
      owner: zew1me
      name: actionlint
    commit_author:
      name: 'github-actions[bot]'
      email: '41898282+github-actions[bot]@users.noreply.github.com'

changelog:
  disable: true
